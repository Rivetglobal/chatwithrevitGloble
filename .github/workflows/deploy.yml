name: Trigger production deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify (frontend)
        env:
          URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::warning::COOLIFY_WEBHOOK_URL is not set — this Action cannot trigger Coolify."
            echo "Coolify Git auto-deploy (if enabled) may still rebuild the frontend."
            echo "Otherwise: Coolify → frontend app → Redeploy (force rebuild)."
            echo "Optional: add GitHub secret COOLIFY_WEBHOOK_URL = Coolify frontend deploy webhook."
            exit 0
          fi
          curl -fsS -X GET "$URL"
          echo "Coolify frontend webhook triggered."

      - name: Trigger Coolify (API)
        env:
          URL: ${{ secrets.COOLIFY_API_WEBHOOK_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::warning::COOLIFY_API_WEBHOOK_URL is not set — API webhook skipped."
            echo "If Coolify Git auto-deploy is off for the API, redeploy that app manually too."
            exit 0
          fi
          curl -fsS -X GET "$URL"
          echo "Coolify API webhook triggered."
